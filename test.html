<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeVision Logo Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: bold;
            color: #1e40af;
        }
        .logo-icon {
            width: 40px;
            height: 40px;
        }
    </style>
</head>
<body>
    <h1>TradeVision Logo Test</h1>
    
    <div class="logo">
        <svg class="logo-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="20" r="18" fill="url(#logoGradient)" stroke="#1e40af" stroke-width="2"/>
            <path d="M12 25 L16 21 L20 23 L24 19 L28 15" stroke="white" stroke-width="2" fill="none"/>
            <circle cx="16" cy="21" r="1.5" fill="white"/>
            <circle cx="20" cy="23" r="1.5" fill="white"/>
            <circle cx="24" cy="19" r="1.5" fill="white"/>
            <defs>
                <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#3b82f6"/>
                    <stop offset="100%" style="stop-color:#1e40af"/>
                </linearGradient>
            </defs>
        </svg>
        <span>TradeVision</span>
    </div>
    
    <p>If you can see the blue circular logo with a trading chart line above, then the logo is working correctly!</p>
</body>
</html>
